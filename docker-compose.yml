services:
  chroma:
    image: chromadb/chroma:latest
    container_name: ageix-chroma
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: ageix-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - FORTIGATE_IP=192.168.56.2
      - FORTIGATE_API_TOKEN=H5HO7hxk567gjQnn6qh4xc7j8k7htj
      - WEBHOOK_URL=http://localhost:5678/
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ageix-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/execute-soar
    depends_on:
      - chroma
      - n8n
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ageix-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
  n8n_data:
